name: Reproducibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulation:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      MUJOCO_GL: osmesa
      HF_HUB_OFFLINE: "1"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10.19"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/constraints-py310.txt
      - name: Install rendering and video libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libosmesa6 ffmpeg
      - name: Install CPU baseline
        run: |
          python -m pip install pip==25.3
          python -m pip install torch==2.7.1 torchvision==0.22.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -c requirements/constraints-py310.txt -e ".[keyboard,dev]"
          python -m pip check
      - name: Check entry points and offline integration
        run: |
          python -m project.rl.actor --help > /dev/null
          python -m project.rl.learner --help > /dev/null
          python -m project.rl.gym_manipulator --help > /dev/null
          python -m pytest
      - name: Build distribution and verify installed wheel
        run: |
          python -m build
          python -m pip uninstall -y so100-rl-vla
          python -m pip install --no-deps dist/*.whl
          cd "$(mktemp -d)"
          python -m project.rl.smoke --config_path "$GITHUB_WORKSPACE/config/train_so100_sim.json"
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
