<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">SO100 · RL · VLA</title>
  <desc id="desc">An open simulation playground for robot learning. A schematic SO100 arm connects simulation, learning, and deployment.</desc>
