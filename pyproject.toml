[build-system]
requires = ["setuptools==80.10.1", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "so100-rl-vla"
version = "0.1.0"
description = "A MuJoCo SO100 manipulation environment with actor–learner SAC training"
authors = [{name = "Chengwei Zhang", email = "ZhangCW233666@163.com"}]
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10,<3.11"
# Install matching CPU or CUDA PyTorch wheels first; see README.md.
dependencies = [
    "torch==2.7.1",
    "torchvision==0.22.1",
    "accelerate==1.12.0",
    "av==15.1.0",
    "datasets==4.1.1",
    "deepdiff==8.6.1",
    "draccus==0.10.0",
    "einops==0.8.2",
    "fsspec==2025.9.0",
    "grpcio==1.73.1",
    "gymnasium==1.2.3",
    "huggingface-hub==0.35.3",
    "imageio==2.37.2",
    "mujoco==3.4.0",
    "numpy==2.2.6",
    "opencv-python-headless==4.12.0.88",
    "packaging==25.0",
    "pandas==2.3.3",
    "pillow==12.1.0",
    "protobuf==6.31.1",
    "pyarrow==23.0.0",
    "pyserial==3.5",
    "safetensors==0.7.0",
    "termcolor==3.3.0",
    "tqdm==4.67.2",
    "transformers==4.57.6",
    "typing-extensions==4.15.0",
]

[project.optional-dependencies]
keyboard = ["pynput==1.8.1"]
tracking = ["wandb==0.24.1"]
realsense = ["pyrealsense2>=2.54,<3"]
kinematics = ["placo>=0.9,<1"]
diffusion = ["diffusers==0.35.2"]
dev = ["pytest==9.0.2", "build==1.6.1"]

[project.urls]
Homepage = "https://github.com/NOOBHZ233/SO100-RL-VLA"
Issues = "https://github.com/NOOBHZ233/SO100-RL-VLA/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["project*"]
namespaces = true
exclude = ["*.__pycache__*"]

[tool.setuptools.package-data]
"project.rl.gym_so100" = ["model/*.xml", "model/*.md", "model/LICENSE", "model/assets/*.stl"]
"project.envs" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
